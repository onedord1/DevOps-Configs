---
# =============================================================================
#  role: worker  —  join the node to the cluster
# =============================================================================

- name: Check if the node has already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Fetch the join command from the control plane
  ansible.builtin.set_fact:
    worker_join_command: "{{ hostvars[groups['control_plane'][0]].worker_join_command }}"

- name: Join the node to the cluster
  ansible.builtin.command: >-
    {{ worker_join_command }} --cri-socket unix://{{ containerd_socket }} --ignore-preflight-errors=Swap
  when: not kubelet_conf.stat.exists
  register: kubeadm_join
  changed_when: kubeadm_join.rc == 0
