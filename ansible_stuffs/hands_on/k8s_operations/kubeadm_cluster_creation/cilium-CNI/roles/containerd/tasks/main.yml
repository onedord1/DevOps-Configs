---
# =============================================================================
#  role: containerd  —  CRI runtime with the systemd cgroup driver
# =============================================================================

- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure /etc/containerd exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Check whether containerd config already exists
  ansible.builtin.stat:
    path: "{{ containerd_config_path }}"
  register: containerd_cfg

- name: Generate default containerd configuration
  ansible.builtin.shell: "containerd config default > {{ containerd_config_path }}"
  args:
    creates: "{{ containerd_config_path }}"
  when: not containerd_cfg.stat.exists

- name: Enable the systemd cgroup driver
  ansible.builtin.replace:
    path: "{{ containerd_config_path }}"
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Ensure containerd is enabled and running
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
