# =============================================================================
#  ansible.cfg  —  kubeadm + Cilium (kube-proxy-free) cluster automation
# -----------------------------------------------------------------------------
#  Console output is beautified locally by the bundled "k8s_beautified" stdout
#  callback (see ./callback_plugins/k8s_beautified.py). It degrades to clean
#  plaintext automatically when piped to a file or when NO_COLOR is set.
# =============================================================================

[defaults]
inventory                 = inventories/production/hosts.yml
roles_path                = roles
collections_path          = collections
callback_plugins          = callback_plugins
stdout_callback           = k8s_beautified
# Allow the pretty callback to also format ad-hoc/bin tasks
bin_ansible_callbacks     = True

# Performance / ergonomics
forks                     = 10
gathering                 = smart
# NOTE: fact caching is deliberately DISABLED. This project provisions
# infrastructure whose IPs can change when instances are recreated; a stale
# cached ansible_default_ipv4 would bake a dead advertiseAddress into kubeadm.
fact_caching              = memory
retry_files_enabled       = False
interpreter_python        = auto_silent
deprecation_warnings      = False
command_warnings          = False
force_color               = True

# Security: host key checking is controllable from the environment.
# Defaults to False for first-run convenience; set ANSIBLE_HOST_KEY_CHECKING=True
# (and pre-populate known_hosts) for a hardened run.
host_key_checking         = False

[privilege_escalation]
become                    = True
become_method             = sudo
become_user               = root
become_ask_pass           = False

[ssh_connection]
pipelining                = True
ssh_args                  = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o PreferredAuthentications=publickey
control_path              = %(directory)s/%%h-%%p-%%r
timeout                   = 30
