---
# =============================================================================
#  Production inventory  —  fully env-driven (no hard-coded hosts)
# -----------------------------------------------------------------------------
#  Connection IPs come from the environment so the same inventory is reusable
#  across clusters. Set them in .env (see .env.example) and `source .env`.
# =============================================================================
all:
  children:
    k8s_cluster:
      children:
        control_plane:
          hosts:
            control-plane:
              ansible_host: "{{ lookup('env', 'K8S_CONTROL_PLANE_IP') }}"
        workers:
          hosts:
            worker-01:
              ansible_host: "{{ lookup('env', 'K8S_WORKER1_IP') }}"
            worker-02:
              ansible_host: "{{ lookup('env', 'K8S_WORKER2_IP') }}"
